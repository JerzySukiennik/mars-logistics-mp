<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MARS LOGISTICS</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<style>
:root {
  --bg-panel: rgba(12, 10, 9, 0.82);
  --bg-panel-hi: rgba(24, 20, 17, 0.92);
  --bg-input: rgba(255, 255, 255, 0.06);
  --stroke: rgba(255, 255, 255, 0.10);
  --stroke-hi: rgba(255, 255, 255, 0.22);
  --text-hi: #F2EDE8;
  --text-md: #B8AFA6;
  --text-lo: #7A716A;
  --accent: #E8763A;
  --accent-hi: #FF9350;
  --ok: #5FBF7A;
  --warn: #E8B93A;
  --danger: #E14D3C;
  --info: #4FA3D9;
  --credits: #EDCB6A;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.25, 0.9, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0605; }
body {
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  color: var(--text-hi);
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; }
#nameplates { position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; }
#hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; user-select: none; }
#hud * { user-select: none; }
#hud .interactive, #hud button, #hud input, #hud select { pointer-events: auto; }
#minimap-wrap {
  position: fixed; right: 16px; bottom: 16px; z-index: 20;
  background: var(--bg-panel); border: 1px solid var(--stroke); border-radius: 6px;
  padding: 4px; pointer-events: auto; user-select: none;
}
#minimap { display: block; border-radius: 4px; }
#toasts {
  position: fixed; top: 48px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  min-height: 36px; max-width: 380px; padding: 8px 16px;
  background: var(--bg-panel-hi); border: 1px solid var(--stroke); border-radius: 6px;
  font-size: 13px; color: var(--text-hi); display: flex; align-items: center; gap: 8px;
  animation: toast-in 160ms var(--ease);
  pointer-events: none;
}
.toast.warn { border-left: 3px solid var(--warn); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
@keyframes toast-in { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
#buildmode { position: fixed; inset: 0; z-index: 40; user-select: none; }
#overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 6, 5, 0.7); user-select: none; }
#banner {
  position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  background: rgba(225, 77, 60, 0.92); color: #14100D;
  font-size: 13px; font-weight: 600; user-select: none;
  transition: transform 200ms var(--ease);
}
#banner.ok { background: rgba(95, 191, 122, 0.92); }
#entry {
  position: fixed; inset: 0; z-index: 70;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}
#entry:empty { display: none; }
#presence {
  position: fixed; top: 16px; right: 16px; z-index: 20;
  display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
  pointer-events: none; user-select: none;
}
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-panel); border: 1px solid var(--stroke); border-radius: 999px;
  padding: 4px 12px;
}
.panel {
  background: var(--bg-panel); border: 1px solid var(--stroke); border-radius: 6px;
  padding: 12px;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-lo); }
button, .btn {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--text-hi);
  background: var(--bg-input); border: 1px solid var(--stroke); border-radius: 6px;
  padding: 8px 16px; cursor: pointer;
  transition: transform 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
}
button:hover, .btn:hover { border-color: var(--stroke-hi); transform: translateY(-1px); }
button:active, .btn:active { transform: translateY(0) scale(0.98); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled, .btn.disabled { opacity: 0.4; pointer-events: none; }
button.primary, .btn.primary { background: var(--accent); color: #14100D; border-color: transparent; }
button.primary:hover, .btn.primary:hover { background: var(--accent-hi); }
input[type="text"] {
  font: inherit; color: var(--text-hi); background: var(--bg-input);
  border: 1px solid var(--stroke); border-radius: 4px; padding: 12px;
}
input[type="text"]:focus { border-color: var(--stroke-hi); outline: none; }
#vignette {
  position: fixed; inset: 0; z-index: 5; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 58%, rgba(8, 4, 3, 0.42) 100%);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="nameplates"></div>
<div id="hud"><!-- HUD root (C3 appends inside) --></div>
<div id="buildmode" hidden><!-- Build mode root (C2 appends inside) --></div>
<div id="minimap-wrap"><canvas id="minimap" width="220" height="220"></canvas></div>
<div id="toasts"></div>
<div id="banner" hidden></div>
<div id="overlay" hidden><!-- Menu/help overlay root (C3 appends inside) --></div>
<div id="entry"><!-- Entry screen root (C3 appends inside) --></div>
<div id="presence"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
